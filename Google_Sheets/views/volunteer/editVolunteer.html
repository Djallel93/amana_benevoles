<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <?!= HtmlService.createHtmlOutputFromFile('assets/css/volunteer_styles').getContent(); ?>
</head>

<body>
    <div class="form-container">
        <h2>✏️ Modifier Bénévole</h2>

        <div id="alertBox" class="alert"></div>
        <div id="loadingBox" class="loading">
            <div class="spinner"></div>
            <p>Chargement...</p>
        </div>

        <div id="searchSection" class="search-box">
            <div class="form-group">
                <label>Rechercher un bénévole</label>
                <input type="text" id="searchInput" placeholder="Nom, prénom ou email...">
            </div>
            <div id="volunteerList" class="volunteer-list"></div>
        </div>

        <form id="editForm" style="display: none;">
            <input type="hidden" id="volunteerId">

            <h3>Informations personnelles</h3>

            <div class="form-group">
                <label class="required">Nom</label>
                <input type="text" id="nom" required>
            </div>

            <div class="form-group">
                <label class="required">Prénom</label>
                <input type="text" id="prenom" required>
            </div>

            <div class="form-group">
                <label class="required">Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label class="required">Téléphone</label>
                <input type="tel" id="telephone" required>
            </div>

            <h3>Statut et droits</h3>

            <div class="form-group">
                <label>Statut</label>
                <select id="statut">
                    <option value="Reçu">Reçu</option>
                    <option value="En cours">En cours</option>
                    <option value="Validé">Validé</option>
                    <option value="Rejeté">Rejeté</option>
                    <option value="Archivé">Archivé</option>
                </select>
            </div>

            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="actif">
                    <label for="actif" style="margin: 0;">Bénévole actif</label>
                </div>
            </div>

            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="confiance">
                    <label for="confiance" style="margin: 0;">Bénévole de confiance (Tirelires)</label>
                </div>
            </div>

            <div class="form-group">
                <label>Véhicule</label>
                <select id="vehicule">
                    <option value="">-- Aucun véhicule --</option>
                </select>
            </div>

            <div class="button-group">
                <button type="button" class="btn-secondary" onclick="cancelEdit()">Annuler</button>
                <button type="button" class="btn-danger" onclick="archiveVolunteer()">Archiver</button>
                <button type="submit" class="btn-primary">Enregistrer</button>
            </div>
        </form>
    </div>

    <?!= HtmlService.createHtmlOutputFromFile('assets/js/editVolunteer').getContent(); ?>
</body>

</html>

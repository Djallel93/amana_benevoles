< !DOCTYPE html>
    <html>

    <head>
        <base target="_top">
        <?!= HtmlService.createHtmlOutputFromFile('assets/css/volunteer_styles').getContent(); ?>
    </head>

    <body>
        <div class="form-container">
            <h2>📧 Demander Disponibilités</h2>

            <div id="alertBox" class="alert"></div>
            <div id="loadingBox" class="loading">
                <div class="spinner"></div>
                <p>Envoi en cours...</p>
            </div>

            <form id="availabilityForm">
                <h3>Détails de l'événement</h3>

                <input type="hidden" id="eventId" value="">

                <div class="form-group">
                    <label class="required">Titre de l'événement</label>
                    <input type="text" id="titre" required placeholder="Ex: Grande Collecte Mensuelle">
                </div>

                <div class="form-group">
                    <label class="required">Date</label>
                    <input type="date" id="date" required>
                </div>

                <div class="form-group">
                    <label class="required">Horaire</label>
                    <input type="text" id="horaire" required placeholder="Ex: 9h00 - 12h00">
                </div>

                <div class="form-group">
                    <label class="required">Lieu</label>
                    <input type="text" id="lieu" required placeholder="Ex: Entrepôt principal">
                </div>

                <div class="form-group">
                    <label class="required">Type d'activité</label>
                    <select id="type" required>
                        <option value="">-- Sélectionner --</option>
                        <option value="Grande Collecte">Grande Collecte</option>
                        <option value="Opération Courante">Opération Courante</option>
                        <option value="Collecte Tirelires">Collecte Tirelires</option>
                        <option value="Autre">Autre</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Description (optionnelle)</label>
                    <textarea id="description" rows="3" placeholder="Détails supplémentaires..."></textarea>
                </div>

                <div class="section">
                    <h3>Sélection des bénévoles</h3>

                    <div class="form-group">
                        <label>Filtrer par</label>
                        <select id="filterType" onchange="updateVolunteerList()">
                            <option value="all">Tous les bénévoles actifs</option>
                            <option value="status">Par statut</option>
                            <option value="trust">Bénévoles de confiance</option>
                            <option value="disponibilite">Par disponibilité</option>
                            <option value="quartier">Par quartier</option>
                        </select>
                    </div>

                    <div id="filterOptions" class="form-group" style="display: none;">
                        <label>Options de filtre</label>
                        <select id="filterValue">
                            <option value="">-- Sélectionner --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Rechercher</label>
                        <input type="text" id="searchVolunteer" placeholder="Nom, prénom ou email...">
                    </div>

                    <div id="volunteerSelection" class="volunteer-list" style="min-height: 200px;">
                        <p style="text-align: center; color: #666;">Chargement des bénévoles...</p>
                    </div>

                    <div class="form-group">
                        <p><strong id="selectedCount">0</strong> bénévole(s) sélectionné(s)</p>
                    </div>
                </div>

                <div class="button-group">
                    <button type="button" class="btn-secondary" onclick="google.script.host.close()">Annuler</button>
                    <button type="submit" class="btn-primary">Envoyer les demandes</button>
                </div>
            </form>
        </div>

        <script>
            let allVolunteers = [];
            let selectedVolunteers = new Set();

            window.onload = function () {
                loadVolunteers();

                // Générer un ID d'événement unique
                document.getElementById('eventId').value = 'EVT_' + new Date().getTime();
            };

            function loadVolunteers() {
                google.script.run
                    .withSuccessHandler(function (volunteers) {
                        allVolunteers = volunteers.filter(v => v.actif && v.statut === 'Validé');
                        displayVolunteers(allVolunteers);
                    })
                    .withFailureHandler(onError)
                    .getAllVolunteers({});
            }

            function displayVolunteers(volunteers) {
                const container = document.getElementById('volunteerSelection');
                container.innerHTML = '';

                if (volunteers.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: #666;">Aucun bénévole trouvé</p>';
                    return;
                }

                volunteers.forEach(volunteer => {
                    const item = document.createElement('div');
                    item.className = 'volunteer-item';
                    item.style.display = 'flex';
                    item.style.alignItems = 'center';
                    item.style.gap = '10px';

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.id = 'vol_' + volunteer.id;
                    checkbox.value = volunteer.id;
                    checkbox.checked = selectedVolunteers.has(volunteer.id);
                    checkbox.onchange = function () {
                        if (this.checked) {
                            selectedVolunteers.add(volunteer.id);
                        } else {
                            selectedVolunteers.delete(volunteer.id);
                        }
                        updateSelectedCount();
                    };

                    const label = document.createElement('label');
                    label.setAttribute('for', 'vol_' + volunteer.id);
                    label.style.flex = '1';
                    label.style.cursor = 'pointer';
                    label.style.margin = '0';

                    let badges = '';
                    if (volunteer.confiance) {
                        badges = '<span class="info-badge badge-trust">Confiance</span>';
                    }

                    label.innerHTML = `
                <strong>${volunteer.prenom} ${volunteer.nom}</strong> ${badges}<br>
                    <small style="color: #666;">${volunteer.email}</small>
                    `;

                    item.appendChild(checkbox);
                    item.appendChild(label);
                    container.appendChild(item);
                });
            }

            function updateVolunteerList() {
                const filterType = document.getElementById('filterType').value;
                const filterOptions = document.getElementById('filterOptions');
                const filterValue = document.getElementById('filterValue');

                if (filterType === 'all') {
                    filterOptions.style.display = 'none';
                    displayVolunteers(allVolunteers);
                    return;
                }

                filterOptions.style.display = 'block';
                filterValue.innerHTML = '<option value="">-- Sélectionner --</option>';

                // Options selon le type de filtre
                if (filterType === 'status') {
                    ['Reçu', 'En cours', 'Validé'].forEach(status => {
                        const option = document.createElement('option');
                        option.value = status;
                        option.textContent = status;
                        filterValue.appendChild(option);
                    });
                } else if (filterType === 'disponibilite') {
                    ['Matin', 'Après-midi', 'Soirée', 'Week-end'].forEach(dispo => {
                        const option = document.createElement('option');
                        option.value = dispo;
                        option.textContent = dispo;
                        filterValue.appendChild(option);
                    });
                } else if (filterType === 'trust') {
                    filterOptions.style.display = 'none';
                    const filtered = allVolunteers.filter(v => v.confiance);
                    displayVolunteers(filtered);
                }
            }

            document.getElementById('filterValue').addEventListener('change', function () {
                const filterType = document.getElementById('filterType').value;
                const value = this.value;

                if (!value) {
                    displayVolunteers(allVolunteers);
                    return;
                }

                let filtered = allVolunteers;

                if (filterType === 'status') {
                    filtered = allVolunteers.filter(v => v.statut === value);
                }

                displayVolunteers(filtered);
            });

            document.getElementById('searchVolunteer').addEventListener('input', function (e) {
                const term = e.target.value.toLowerCase();
                const filtered = allVolunteers.filter(v =>
                    v.nom.toLowerCase().includes(term) ||
                    v.prenom.toLowerCase().includes(term) ||
                    v.email.toLowerCase().includes(term)
                );
                displayVolunteers(filtered);
            });

            function updateSelectedCount() {
                document.getElementById('selectedCount').textContent = selectedVolunteers.size;
            }

            document.getElementById('availabilityForm').addEventListener('submit', function (e) {
                e.preventDefault();

                if (selectedVolunteers.size === 0) {
                    showAlert('error', '❌ Veuillez sélectionner au moins un bénévole');
                    return;
                }

                const eventDetails = {
                    eventId: document.getElementById('eventId').value,
                    titre: document.getElementById('titre').value.trim(),
                    date: document.getElementById('date').value,
                    horaire: document.getElementById('horaire').value.trim(),
                    lieu: document.getElementById('lieu').value.trim(),
                    type: document.getElementById('type').value,
                    description: document.getElementById('description').value.trim()
                };

                const volunteerIds = Array.from(selectedVolunteers);

                document.getElementById('loadingBox').style.display = 'block';
                document.getElementById('alertBox').style.display = 'none';

                google.script.run
                    .withSuccessHandler(onSendSuccess)
                    .withFailureHandler(onError)
                    .sendBulkAvailabilityRequests(volunteerIds, eventDetails);
            });

            function onSendSuccess(result) {
                document.getElementById('loadingBox').style.display = 'none';

                let message = `✅ Envoyé: ${result.sent}<br>`;
                if (result.failed > 0) {
                    message += `❌ Échecs: ${result.failed}`;
                }

                showAlert('success', message);

                setTimeout(() => {
                    google.script.host.close();
                }, 2000);
            }

            function onError(error) {
                document.getElementById('loadingBox').style.display = 'none';
                showAlert('error', '❌ Erreur: ' + error.message);
            }

            function showAlert(type, message) {
                const alertBox = document.getElementById('alertBox');
                alertBox.className = `alert alert-${type}`;
                alertBox.innerHTML = message;
                alertBox.style.display = 'block';
            }
        </script>
    </body>

    </html>
